<svg width="760" height="820" viewBox="0 0 760 820" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      .crt-bg { fill: #0a0e0a; }
      .term-text {
        font-family: 'Courier New', 'Consolas', monospace;
        font-size: 15px;
        fill: #33ff66;
      }
      .term-text-dim {
        font-family: 'Courier New', 'Consolas', monospace;
        font-size: 15px;
        fill: #1f8f3d;
      }
      .term-head {
        font-family: 'Courier New', 'Consolas', monospace;
        font-size: 15px;
        fill: #66ffaa;
      }
      .link-text {
        font-family: 'Courier New', 'Consolas', monospace;
        font-size: 15px;
        fill: #33ff66;
        text-decoration: underline;
      }
      .link-text:hover { fill: #aaffbb; }
      .cursor {
        fill: #33ff66;
        animation: blink 0.9s steps(1) infinite;
      }
      @keyframes blink {
        0%, 50% { opacity: 1; }
        50.01%, 100% { opacity: 0; }
      }
      .glow { filter: url(#phosphor-glow); }
    </style>
    <filter id="phosphor-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <rect width="4" height="1" fill="#000000" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- CRT background -->
  <rect class="crt-bg" width="760" height="820" rx="8"/>
  <rect x="4" y="4" width="752" height="812" rx="6" fill="none" stroke="#1a3d1a" stroke-width="2"/>

