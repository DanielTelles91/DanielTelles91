<svg width="760" height="820" viewBox="0 0 760 820" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .crt-bg { fill: #0a0e0a; }
      .term-text {
        font-family: 'Courier New', 'Consolas', monospace;
        font-size: 15px;
        fill: #33ff66;
      }
      .term-text-dim {
        font-family: 'Courier New', 'Consolas', monospace;
        font-size: 15px;
        fill: #1f8f3d;
      }
      .term-head {
        font-family: 'Courier New', 'Consolas', monospace;
        font-size: 15px;
        fill: #66ffaa;
      }
      .cursor {
        fill: #33ff66;
        animation: blink 0.9s steps(1) infinite;
      }
      @keyframes blink {
        0%, 50% { opacity: 1; }
        50.01%, 100% { opacity: 0; }
      }
      .typeLine {
        clip-path: inset(0 100% 0 0);
        animation: typeWipe 0.35s steps(14) forwards;
      }
      @keyframes typeWipe {
        to { clip-path: inset(0 0% 0 0); }
      }
    </style>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <rect width="4" height="1" fill="#000000" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- CRT background -->
  <rect class="crt-bg" width="760" height="820" rx="8"/>
  <rect x="4" y="4" width="752" height="812" rx="6" fill="none" stroke="#1a3d1a" stroke-width="2"/>

  <g>
    <!-- Boot header -->
    <g class="typeLine" style="animation-delay:0.00s"><text x="30" y="36" class="term-text">APPLE ][ PLUS  48K  ROM BASIC</text></g>
    <g class="typeLine" style="animation-delay:0.16s"><text x="30" y="58" class="term-text-dim">]LOAD DANIEL.PROFILE</text></g>
    <g class="typeLine" style="animation-delay:0.32s"><text x="30" y="80" class="term-text-dim">]RUN</text></g>
    <g class="typeLine" style="animation-delay:0.48s"><text x="30" y="104" class="term-text-dim">--------------------------------------------</text></g>

    <!-- Identity -->
    <g class="typeLine" style="animation-delay:0.64s"><text x="30" y="130" class="term-head">NAME......: DANIEL ARANTES TELLES</text></g>
    <g class="typeLine" style="animation-delay:0.80s"><text x="30" y="152" class="term-text">ROLE......: FULL STACK JAVA DEVELOPER</text></g>
    <g class="typeLine" style="animation-delay:0.96s"><text x="30" y="174" class="term-text">FOCUS.....: SPRING BOOT / ANGULAR</text></g>
    <g class="typeLine" style="animation-delay:1.12s"><text x="30" y="196" class="term-text">EDUCATION.: SYSTEMS ANALYSIS &amp; DEV (ADS)</text></g>
    <g class="typeLine" style="animation-delay:1.28s"><text x="30" y="218" class="term-text">EDUCATION.: ELECTRONICS TECHNICIAN</text></g>
    <g class="typeLine" style="animation-delay:1.44s"><text x="30" y="240" class="term-text">LOCATION..: SAO PAULO, BRAZIL</text></g>
    <g class="typeLine" style="animation-delay:1.60s"><text x="30" y="264" class="term-text-dim">--------------------------------------------</text></g>

    <!-- About -->
    <g class="typeLine" style="animation-delay:1.76s"><text x="30" y="290" class="term-head">]PRINT ABOUT.TXT</text></g>
    <g class="typeLine" style="animation-delay:1.92s"><text x="30" y="312" class="term-text-dim">SOFTWARE DEV FOCUSED ON JAVA, SPRING BOOT</text></g>
    <g class="typeLine" style="animation-delay:2.08s"><text x="30" y="332" class="term-text-dim">AND ANGULAR. COMBINES SOFTWARE SKILLS WITH</text></g>
    <g class="typeLine" style="animation-delay:2.24s"><text x="30" y="352" class="term-text-dim">HANDS ON HARDWARE &amp; EMBEDDED EXPERIENCE.</text></g>
    <g class="typeLine" style="animation-delay:2.40s"><text x="30" y="372" class="term-text-dim">BUILDS FULL PROJECTS WITH CLEAN CODE AND</text></g>
    <g class="typeLine" style="animation-delay:2.56s"><text x="30" y="392" class="term-text-dim">SOLID ARCHITECTURE.</text></g>
    <g class="typeLine" style="animation-delay:2.72s"><text x="30" y="416" class="term-text-dim">--------------------------------------------</text></g>

    <!-- Tech stack -->
    <g class="typeLine" style="animation-delay:2.88s"><text x="30" y="442" class="term-head">]LIST TECH.STACK</text></g>
    <g class="typeLine" style="animation-delay:3.04s"><text x="30" y="464" class="term-text">BACKEND...: JAVA, SPRING, JPA, REST APIs, MYSQL</text></g>
    <g class="typeLine" style="animation-delay:3.20s"><text x="30" y="486" class="term-text">FRONTEND..: ANGULAR JS, HTML5, CSS3, BOOTSTRAP</text></g>
    <g class="typeLine" style="animation-delay:3.36s"><text x="30" y="508" class="term-text">TOOLS.....: GIT, GITHUB, DOCKER, POSTMAN</text></g>
    <g class="typeLine" style="animation-delay:3.52s"><text x="30" y="530" class="term-text">EMBEDDED..: RASPBERRY PI, ATMEGA, PIC</text></g>
    <g class="typeLine" style="animation-delay:3.68s"><text x="30" y="554" class="term-text-dim">--------------------------------------------</text></g>

    <!-- Catalog -->
    <g class="typeLine" style="animation-delay:3.84s"><text x="30" y="580" class="term-head">]CATALOG</text></g>
    <g class="typeLine" style="animation-delay:4.00s"><text x="30" y="602" class="term-text-dim">DISK VOLUME 254, DRIVE 1</text></g>
    <g class="typeLine" style="animation-delay:4.48s"><text x="30" y="672" class="term-text">*B 006 FULLSTACK.APPS</text></g>
    <g class="typeLine" style="animation-delay:4.64s"><text x="30" y="694" class="term-text">*B 003 DESKTOP.APPS</text></g>
    <g class="typeLine" style="animation-delay:4.80s"><text x="30" y="716" class="term-text">*B 009 EMBEDDED.PROJECTS</text></g>
    <g class="typeLine" style="animation-delay:4.96s"><text x="30" y="742" class="term-text-dim">--------------------------------------------</text></g>
    <g class="typeLine" style="animation-delay:5.12s"><text x="30" y="770" class="term-text">]</text></g>

    <!-- cursor: hidden until boot sequence finishes, then blinks -->
    <rect x="42" y="756" width="10" height="18" class="cursor" opacity="0" style="animation-delay:5.5s"/>
  </g>

  <!-- scanlines overlay -->
  <rect x="0" y="0" width="760" height="820" fill="url(#scanlines)"/>
</svg>
